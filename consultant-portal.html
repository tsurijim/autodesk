<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Consultor - Autodesk Diagnosis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 2em;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .content {
            padding: 40px;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
        }
        
        .diagnoses-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .diagnoses-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
        }
        
        .diagnoses-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .diagnoses-table tr:hover {
            background: #f5f5f5;
        }
        
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #764ba2;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍💼 Portal de Consultor</h1>
            <div class="nav-links">
                <a href="/">← Volver al Formulario</a>
            </div>
        </div>
        
        <div class="content">
            <div class="section">
                <h2>📊 Resumen de Diagnósticos</h2>
                <div id="statsContainer" class="stats-grid">
                    <div class="loading">Cargando estadísticas...</div>
                </div>
            </div>
            
            <div class="section">
                <h2>📋 Diagnósticos Registrados</h2>
                <div id="diagnosesContainer">
                    <div class="loading">Cargando diagnósticos...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Load diagnoses on page load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/diagnoses');
                const data = await response.json();
                
                if (data.success && data.diagnoses && data.diagnoses.length > 0) {
                    // Update stats
                    const statsHtml = `
                        <div class="stat-card">
                            <div class="stat-number">${data.count}</div>
                            <div class="stat-label">Diagnósticos Generados</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${new Date().toLocaleDateString('es-MX')}</div>
                            <div class="stat-label">Fecha Actual</div>
                        </div>
                    `;
                    document.getElementById('statsContainer').innerHTML = statsHtml;
                    
                    // Update diagnoses table
                    const tableHtml = `
                        <table class="diagnoses-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Empresa</th>
                                    <th>Fecha</th>
                                    <th>Madurez</th>
                                    <th>ROI Estimado</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.diagnoses.map(d => `
                                    <tr>
                                        <td>${d.id}</td>
                                        <td>${d.clientName || 'N/A'}</td>
                                        <td>${d.company || 'N/A'}</td>
                                        <td>${new Date(d.diagnosisDate).toLocaleDateString('es-MX')}</td>
                                        <td>${d.maturityLevel || 'N/A'}</td>
                                        <td>$${d.totalROI || 0}</td>
                                        <td><a href="/api/diagnoses/${d.id}" class="btn" target="_blank">Ver</a></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('diagnosesContainer').innerHTML = tableHtml;
                } else {
                    document.getElementById('statsContainer').innerHTML = `
                        <div style="text-align: center; padding: 20px; color: #666;">
                            No hay diagnósticos registrados aún.
                        </div>
                    `;
                    document.getElementById('diagnosesContainer').innerHTML = `
                        <div style="text-align: center; padding: 20px; color: #666;">
                            Los diagnósticos aparecerán aquí cuando se generen.
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('statsContainer').innerHTML = `
                    <div class="error">Error al cargar datos: ${error.message}</div>
                `;
            }
        });
    </script>
</body>
</html>
